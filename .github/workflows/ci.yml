name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        shell: bash
        run: |
          test -s README.md
          test -s LICENSE
          test -s SECURITY.md
          test -s .github/CODEOWNERS