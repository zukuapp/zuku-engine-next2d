name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate repository files
        shell: bash
        run: |
          test -s README.md
          test -s LICENSE
          test -s SECURITY.md

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint

  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Validate package with fixture
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { zipSync } from 'fflate';
          import { validatePackageBytes } from './src/package-validator.mjs';

          const bytes = zipSync({
            'index.html': readFileSync('fixtures/sample-jump/index.html'),
            'jump.manifest.json': readFileSync('fixtures/sample-jump/jump.manifest.json'),
          });
          const result = validatePackageBytes(bytes, 'pc');
          if (!result.valid || result.manifest.entry_point !== 'index.html') {
            throw new Error('fixture package validation failed');
          }
          console.log('Fixture package validated:', result.sha256);
          NODE
